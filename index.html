  <!-- LOGIC ĐỒNG BỘ API & TRÌNH PHÁT VIDEO CHỐNG LAG TỐI ƯU CAO -->
  <script>
    const API_URL = "https://vip.phaivan6593.workers.dev/api/config";
    const DEFAULT_FALLBACK_STREAM = "https://live05.koepgd.app/live/16226575.m3u8";
    const videoContainer = document.getElementById('videoContainer');
    const videoLoading = document.getElementById('videoLoading');

    function initAutoSlider() {
      const slider = document.getElementById('bannerContainer');
      if (!slider) return;

      let isDown = false;
      let startX, scrollLeft, autoPlayTimer;

      function startAutoPlay() {
        autoPlayTimer = setInterval(() => {
          if (isDown) return; 
          const items = slider.querySelectorAll('.banner-item');
          if (!items.length) return;
          const itemWidth = items[0].offsetWidth + 12; 
          const maxScroll = slider.scrollWidth - slider.clientWidth;

          if (slider.scrollLeft >= maxScroll - 5) {
            slider.scrollTo({ left: 0, behavior: 'smooth' });
          } else {
            slider.scrollBy({ left: itemWidth, behavior: 'smooth' });
          }
        }, 3000); 
      }

      function stopAutoPlay() { clearInterval(autoPlayTimer); }

      slider.addEventListener('mousedown', (e) => {
        isDown = true; stopAutoPlay();
        startX = e.pageX - slider.offsetLeft;
        scrollLeft = slider.scrollLeft;
      });
      slider.addEventListener('mouseleave', () => { if (isDown) { isDown = false; startAutoPlay(); } });
      slider.addEventListener('mouseup', () => { isDown = false; startAutoPlay(); });
      slider.addEventListener('mousemove', (e) => {
        if(!isDown) return;
        e.preventDefault();
        const x = e.pageX - slider.offsetLeft;
        const walk = (x - startX) * 1.5; 
        slider.scrollLeft = scrollLeft - walk;
      });
      slider.addEventListener('touchstart', stopAutoPlay, { passive: true });
      slider.addEventListener('touchend', startAutoPlay, { passive: true });
      startAutoPlay();
    }

    function parseYouTubeUrl(url) {
      let id = '';
      if (url.includes('youtube.com/live/')) {
        id = url.split('youtube.com/live/')[1].split(/[?&]/)[0];
      } else if (url.includes('youtu.be/')) {
        id = url.split('youtu.be/')[1].split(/[?&]/)[0];
      } else if (url.includes('v=')) {
        id = url.split('v=')[1].split('&')[0];
      } else if (url.includes('youtube.com/embed/')) {
        id = url.split('youtube.com/embed/')[1].split(/[?&]/)[0];
      }
      return id ? `https://www.youtube.com/embed/${id}?autoplay=1&mute=1&controls=1&rel=0&playsinline=1&enablejsapi=1` : url;
    }

    function loadVideoSource(url) {
      videoLoading.classList.remove('hide');
      videoContainer.innerHTML = '';
      const urlLower = url.toLowerCase();
      
      if (urlLower.includes('youtube.com') || urlLower.includes('youtu.be')) {
        const embed = parseYouTubeUrl(url);
        const iframe = document.createElement('iframe');
        iframe.src = embed;
        iframe.allow = "autoplay; encrypted-media; fullscreen; picture-in-picture";
        iframe.setAttribute('allowfullscreen', 'true');
        iframe.addEventListener('load', () => videoLoading.classList.add('hide'));
        videoContainer.appendChild(iframe);
      } 
      else if (urlLower.match(/\.(mp4|webm|m3u8)/) || urlLower.includes('cam=')) {
        const video = document.createElement('video');
        video.controls = true; video.autoplay = true; video.muted = true;
        video.playsInline = true;
        video.setAttribute('webkit-playsinline', 'true');
        video.setAttribute('x5-playsinline', 'true');
        video.style.width = "100%"; video.style.height = "100%";

        if (urlLower.includes('.m3u8')) {
          if (typeof Hls !== 'undefined' && Hls.isSupported()) {
            const hls = new Hls({
              maxBufferLength: 15, 
              maxMaxBufferLength: 30,
              enableWorker: true,
              lowLatencyMode: true
            });
            hls.loadSource(url);
            hls.attachMedia(video);
            hls.on(Hls.Events.ERROR, function (event, data) {
              if (data.fatal) {
                switch (data.type) {
                  case Hls.ErrorTypes.NETWORK_ERROR: hls.startLoad(); break;
                  case Hls.ErrorTypes.MEDIA_ERROR: hls.recoverMediaError(); break;
                  default: break;
                }
              }
            });
          } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
            video.src = url; 
          }
        } else { video.src = url; }

        video.addEventListener('canplay', () => {
          videoLoading.classList.add('hide');
          video.play().catch(() => {});
        });
        videoContainer.appendChild(video);
      } 
      else {
        const iframe = document.createElement('iframe');
        iframe.src = url + (url.includes('?') ? '&' : '?') + 'autoplay=1&muted=1&enablejsapi=1';
        iframe.allow = "autoplay; fullscreen";
        iframe.setAttribute('allowfullscreen', 'true');
        iframe.addEventListener('load', () => videoLoading.classList.add('hide'));
        videoContainer.appendChild(iframe);
      }
    }

    function unlockAutoplay() {
      const media = videoContainer.querySelector('video');
      if (media) { media.muted = false; media.play().catch(() => {}); }
      
      const iframe = videoContainer.querySelector('iframe');
      if (iframe && iframe.contentWindow && iframe.src.includes('youtube.com')) {
        try {
          iframe.contentWindow.postMessage('{"event":"command","func":"unMute","args":""}', '*');
          iframe.contentWindow.postMessage('{"event":"command","func":"playVideo","args":""}', '*');
        } catch (e) {
          console.warn("Autoplay unlock block:", e);
        }
      }
      ['click', 'touchstart'].forEach(evt => document.removeEventListener(evt, unlockAutoplay));
    }
    ['click', 'touchstart'].forEach(evt => document.addEventListener(evt, unlockAutoplay, { passive: true }));

    async function syncConfig() {
      try {
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 4000); 

        const res = await fetch(API_URL, { cache: "no-store", signal: controller.signal });
        clearTimeout(timeoutId);

        if (!res.ok) throw new Error("Network error");
        const cfg = await res.json();

        const liveSection = document.getElementById('liveSection');
        if (cfg.live_enabled && cfg.show_live_on_home) {
          liveSection.style.display = "block";
          if (cfg.live_url) loadVideoSource(cfg.live_url);
        } else {
          liveSection.style.display = "none";
        }

        const banners = document.querySelectorAll('#bannerContainer .banner-item');
        if (Array.isArray(cfg.banners) && cfg.banners.length) {
          banners.forEach((anchor, idx) => {
            const apiBanner = cfg.banners[idx];
            if (apiBanner) {
              if (apiBanner.href && apiBanner.href !== "#" && apiBanner.href.trim() !== "") {
                anchor.setAttribute("href", apiBanner.href);
              }
              const img = anchor.querySelector('img');
              if (img && apiBanner.img && apiBanner.img.trim() !== "") {
                img.setAttribute("src", apiBanner.img);
              }
            }
          });
        }
      } catch (err) {
        console.error("Config fetch error:", err);
        document.getElementById('liveSection').style.display = "block";
        loadVideoSource(DEFAULT_FALLBACK_STREAM);
      } finally {
        const preloader = document.getElementById('appPreloader');
        if (preloader) preloader.classList.add('fade-out');
        
        /* CHỈNH SỬA CHÍNH: 
           Chờ đúng 4.5 giây (bằng thời gian quả bóng chạy qua chữ) 
           rồi mới bắt đầu làm mờ và ẩn chữ đi hoàn toàn.
        */
        setTimeout(() => {
          const headerTitle = document.getElementById('headerTitleWrapper');
          if (headerTitle) headerTitle.classList.add('fade-out');
        }, 4500); 

        initAutoSlider();
      }
    }

    window.addEventListener('DOMContentLoaded', syncConfig);
  </script>
</body>
