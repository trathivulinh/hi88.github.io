    <style>
        :root {
            --ios-blue: #007af5;
            --ios-green: #34c759;
            --ios-red: #ff3b30;
            --ios-bg: #f2f2f7;
            --ios-card: #ffffff;
            --ios-text: #1c1c1e;
            --ios-subtext: #8e8e93;
            --gradient-accent: linear-gradient(135deg, #007af5, #0056b3);
            --gradient-green: linear-gradient(135deg, #34c759, #28a745);
            --gradient-red: linear-gradient(135deg, #ff3b30, #dc3545);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--ios-bg);
            color: var(--ios-text);
            padding-bottom: 120px;
            overflow-x: hidden;
        }

        /* iOS Header Luxury Glassmorphism */
        header {
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            position: sticky;
            top: 0;
            z-index: 90;
            padding: 24px 20px 20px 20px;
            border-bottom: 0.5px solid rgba(0,0,0,0.06);
            text-align: center;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.02);
        }

        .logo-container {
            font-size: 28px;
            font-weight: 800;
            letter-spacing: -0.8px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            cursor: default;
        }
        
        .logo-container:hover {
            transform: scale(1.04);
        }

        /* HIỆU ỨNG CHỮ ENGINEERING LOANG MÀU CHUYỂN ĐỘNG SIÊU ĐẸP */
        .logo-main {
            background: linear-gradient(
                90deg, 
                #1c1c1e 0%, 
                #007af5 25%, 
                #58a6ff 50%, 
                #007af5 75%, 
                #1c1c1e 100%
            );
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: textShimmer 3.5s linear infinite;
            filter: drop-shadow(0 2px 4px rgba(0, 122, 245, 0.05));
            transition: filter 0.3s ease;
        }
        
        .logo-container:hover .logo-main {
            filter: drop-shadow(0 4px 12px rgba(0, 122, 245, 0.25));
        }

        @keyframes textShimmer {
            0% { background-position: 0% center; }
            100% { background-position: -200% center; }
        }

        .logo-sub {
            background: var(--gradient-accent);
            color: white;
            padding: 2px 10px;
            border-radius: 9px;
            font-size: 21px;
            font-weight: 900;
            margin-left: 2px;
            box-shadow: 0 4px 12px rgba(0, 122, 245, 0.2);
            letter-spacing: 0px;
        }

        /* iOS Dock Menu Floating & Blur */
        nav {
            position: fixed;
            bottom: 24px; left: 24px; right: 24px;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border: 0.5px solid rgba(255, 255, 255, 0.4);
            border-radius: 26px;
            display: flex;
            justify-content: space-around;
            padding: 12px 0;
            z-index: 100;
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.08);
            transform: translateZ(0);
        }

        nav button {
            background: none; border: none;
            display: flex; flex-direction: column; align-items: center;
            color: var(--ios-subtext); font-size: 11px; font-weight: 600;
            cursor: pointer; width: 30%;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        nav button .icon { 
            font-size: 24px; 
            margin-bottom: 4px; 
            filter: grayscale(1) opacity(0.5);
            transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1), filter 0.3s;
        }
        
        nav button:active { transform: scale(0.88); }
        nav button.active { color: var(--ios-blue); text-shadow: 0 0 10px rgba(0,122,245,0.1); }
        nav button.active .icon { 
            transform: scale(1.2) translateY(-3px); 
            filter: grayscale(0) opacity(1);
        }

        .container {
            max-width: 600px;
            margin: 8px auto;
            padding: 0 16px;
        }

        .page { 
            display: none; 
            opacity: 0;
            transform: translateY(20px) scale(0.98);
            transition: opacity 0.4s cubic-bezier(0.16, 1, 0.3, 1), transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }
        
        .page.active { 
            display: block; 
            opacity: 1; 
            transform: translateY(0) scale(1);
        }

        .category-title {
            font-size: 14px;
            font-weight: 700;
            color: #48484a;
            text-transform: uppercase;
            margin: 28px 0 10px 6px;
            letter-spacing: 0.5px;
        }

        .ios-list {
            background: var(--ios-card);
            border-radius: 22px;
            overflow: hidden;
            box-shadow: 0 4px 24px rgba(0,0,0,0.015);
            border: 0.5px solid rgba(0,0,0,0.03);
            margin-bottom: 16px;
        }

        .ios-item {
            padding: 18px 20px;
            border-bottom: 0.5px solid #f2f2f7;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: background 0.2s ease;
        }
        
        .ios-item:last-child { border-bottom: none; }
        .ios-item:hover { background: #fafafc; }

        .item-content {
            display: flex;
            flex-direction: column;
            gap: 4px;
            flex: 1;
        }

        .en { font-size: 17px; font-weight: 700; color: #1c1c1e; }
        .vi { font-size: 15px; color: var(--ios-blue); font-weight: 600; }
        
        .phonetic-badge { 
            font-size: 13px; 
            color: #d35400; 
            font-weight: 600;
            background: #fdf2e9;
            padding: 4px 10px;
            border-radius: 8px;
            display: inline-block;
            align-self: flex-start;
            margin-top: 2px;
            border: 0.5px solid rgba(211, 84, 0, 0.1);
        }

        .speak-btn {
            background: #f2f2f7;
            border: none;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            font-size: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            margin-left: 12px;
            flex-shrink: 0;
            box-shadow: 0 2px 8px rgba(0,0,0,0.02);
        }

        .speak-btn:hover { background: #e5e5ea; transform: scale(1.05); }
        .speak-btn:active { transform: scale(0.9); }

        /* INTERACTIVE QUIZ CARD */
        #quiz-container {
            background: var(--ios-card);
            border-radius: 28px;
            padding: 32px 24px;
            box-shadow: 0 12px 40px rgba(0,0,0,0.025);
            border: 0.5px solid rgba(0,0,0,0.03);
            text-align: center;
            position: relative;
        }

        .progress-bar-container {
            width: 100%; height: 6px;
            background: #e5e5ea; border-radius: 10px;
            margin-bottom: 28px; overflow: hidden;
        }

        #progress-fill {
            height: 100%; width: 0%;
            background: var(--ios-green);
            border-radius: 10px;
            transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .question-title { font-size: 13px; color: var(--ios-subtext); font-weight: 700; letter-spacing: 0.5px; text-transform: uppercase; margin-bottom: 8px; }
        
        .question-box {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 32px;
        }
        
        .question-text { font-size: 26px; font-weight: 800; color: #1c1c1e; letter-spacing: -0.5px; }

        .options { display: flex; flex-direction: column; gap: 12px; }

        .option-btn {
            padding: 18px 20px; background: #f2f2f7;
            border: 1.5px solid transparent; border-radius: 18px;
            font-size: 16px; font-weight: 600; color: #1c1c1e;
            cursor: pointer; text-align: left;
            transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1), background-color 0.25s, color 0.25s, border-color 0.25s;
        }
        
        .option-btn:hover:not(:disabled) { background: #e5e5ea; transform: translateY(-1px); }
        .option-btn:active:not(:disabled) { transform: scale(0.96); }

        .feedback {
            margin-top: 24px; padding: 20px; border-radius: 18px; display: none; text-align: left;
            animation: iosSlideIn 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            border: 0.5px solid transparent;
        }

        @keyframes iosSlideIn {
            from { transform: translateY(15px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        
        .feedback.correct { background: rgba(52, 199, 89, 0.08); color: #1c6b2e; border-color: rgba(52, 199, 89, 0.15); }
        .feedback.wrong { background: rgba(255, 60, 48, 0.06); color: #aa221a; border-color: rgba(255, 60, 48, 0.12); }
        .feedback-title { font-size: 17px; font-weight: 700; margin-bottom: 6px; }
        .explanation { font-size: 14px; line-height: 1.5; color: #2c2c2e; }

        .next-btn {
            margin-top: 24px; background: var(--gradient-accent); color: white;
            border: none; padding: 16px; width: 100%; border-radius: 18px;
            font-size: 16px; font-weight: 600; cursor: pointer;
            box-shadow: 0 6px 20px rgba(0, 122, 245, 0.25); display: none;
            transition: all 0.2s;
        }

        .next-btn:active { transform: scale(0.97); filter: brightness(0.95); }

        .finish-screen { padding: 40px 10px; }
        .score-num { font-size: 84px; font-weight: 800; color: var(--ios-blue); letter-spacing: -2px; text-shadow: 0 4px 12px rgba(0,122,245,0.15); }
        #confetti-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; border-radius: 28px; }
    </style>
</head>

        function speakEnglish(text) {
            let cleanText = text.replace(/\([^)]*\)/g, "").replace(/\/.*/, "").trim();
            let utterance = new SpeechSynthesisUtterance(cleanText);
            utterance.lang = 'en-US';
            utterance.rate = 0.85;
            window.speechSynthesis.speak(utterance);
        }

        function renderiOSLists() {
            const sectors = {
                'bedroom-list': data.bedroom, 'bathroom-list': data.bathroom, 'electric-list': data.electric,
                'public-list': data.public, 'action-list': data.actions, 'problem-list': data.problem, 'comm-list': data.comm
            };
            for (let id in sectors) {
                document.getElementById(id).innerHTML = sectors[id].map(item => `
                    <div class="ios-item">
                        <div class="item-content">
                            <div class="en">${item.en}</div>
                            <div class="vi">${item.vi}</div>
                            <div class="phonetic-badge">🗣️ Đọc bồi: ${item.p}</div>
                        </div>
                        <button class="speak-btn" onclick="speakEnglish('${item.en.replace(/'/g, "\\'")}')">🔊</button>
                    </div>
                `).join('');
            }
        }

        function showPage(pageId) {
            document.querySelectorAll('.page').forEach(p => {
                p.style.display = 'none'; 
                p.classList.remove('active');
            });
            document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
            
            const targetPage = document.getElementById('page-' + pageId);
            targetPage.style.display = 'block'; 
            setTimeout(() => { targetPage.classList.add('active'); }, 10);
            
            document.getElementById('nav-' + pageId).classList.add('active');
            if(pageId === 'quiz') startQuiz();
        }

        /* --- TRẮC NGHIỆM ĐỘNG --- */
        let currentIdx = 0; let score = 0; let currentQuestions = [];

        function startQuiz() {
            currentIdx = 0; score = 0;
            let fullPool = [...data.bedroom, ...data.bathroom, ...data.electric, ...data.public, ...data.actions, ...data.problem, ...data.comm];
            currentQuestions = fullPool.sort(() => 0.5 - Math.random()).slice(0, 10);
            showQuestion();
        }

        function showQuestion() {
            const fbBox = document.getElementById('feedback-box');
            const nxtBtn = document.getElementById('next-btn');
            fbBox.style.display = 'none'; nxtBtn.style.display = 'none';

            let curItem = currentQuestions[currentIdx];
            let choices = [curItem.vi];
            while(choices.length < 4) {
                let fullPool = [...data.bedroom, ...data.bathroom, ...data.electric, ...data.actions, ...data.problem, ...data.comm];
                let randVi = fullPool[Math.floor(Math.random() * fullPool.length)].vi;
                if(!choices.includes(randVi)) choices.push(randVi);
            }
            choices.sort(() => 0.5 - Math.random());

            document.getElementById('progress-fill').style.width = (currentIdx / currentQuestions.length * 100) + '%';
            
            document.getElementById('quiz-content').innerHTML = `
                <div class="question-title">Câu hỏi ${currentIdx + 1} / 10</div>
                <div class="question-box">
                    <div class="question-text">"${curItem.en}"</div>
                    <button class="speak-btn" onclick="speakEnglish('${curItem.en.replace(/'/g, "\\'")}')">🔊</button>
                </div>
                <div class="options">
                    ${choices.map(opt => `<button class="option-btn" onclick="verifyiOSChoice(this, '${opt}', '${curItem.vi}')">${opt}</button>`).join('')}
                </div>
            `;
            
            speakEnglish(curItem.en);
        }

        function verifyiOSChoice(btn, selected, correct) {
            const fbBox = document.getElementById('feedback-box');
            const nxtBtn = document.getElementById('next-btn');
            let item = currentQuestions[currentIdx];
            
            document.querySelectorAll('.option-btn').forEach(b => b.disabled = true);

            if(selected === correct) {
                score++;
                btn.style.background = "var(--gradient-green)"; btn.style.color = "white"; btn.style.borderColor = "transparent";
                triggerConfetti();
                fbBox.innerHTML = `
                    <div class="feedback-title">✓ Đúng rồi!</div>
                    <div class="explanation">Nghĩa là: <b>"${item.vi}"</b> [${item.tag}]. <br>🗣️ Phiên âm bồi: <i>${item.p}</i></div>
                `;
                fbBox.className = "feedback correct";
            } else {
                btn.style.background = "var(--gradient-red)"; btn.style.color = "white"; btn.style.borderColor = "transparent";
                document.querySelectorAll('.option-btn').forEach(b => {
                    if(b.innerText === correct) { 
                        b.style.background = "var(--gradient-green)"; b.style.color = "white"; b.style.borderColor = "transparent";
                    }
                });
                
                speakEnglish(item.en);

                fbBox.innerHTML = `
                    <div class="feedback-title">✕ Chưa chính xác</div>
                    <div class="explanation">
                        • <b>Đáp án đúng:</b> <span style="font-weight:700; color:var(--ios-red);">${correct}</span><br>
                        • <b>Giải thích:</b> Từ <b>"${item.en}"</b> thuộc nhóm ngữ cảnh <i>[${item.tag}]</i>.<br>
                        • <b>Phiên âm bồi:</b> <b>"${item.p}"</b> (Bấm nút loa 🔊 ở trên để nghe lại giọng đọc chuẩn).
                    </div>
                `;
                fbBox.className = "feedback wrong";
            }
            fbBox.style.display = "block";
            nxtBtn.style.display = "block";
        }

        function nextQuestion() {
            currentIdx++;
            if(currentIdx < currentQuestions.length) { showQuestion(); } 
            else { displayiOSResults(); }
        }

        function displayiOSResults() {
            document.getElementById('progress-fill').style.width = '100%';
            let evaluation = "Bạn hãy đọc lại danh sách từ vựng kết hợp nghe âm thanh để cải thiện nhé!";
            if(score === 10) evaluation = "Cực kỳ xuất sắc! Bạn đã làm chủ hoàn toàn các thuật ngữ âm thanh này rồi! 🏆";
            else if(score >= 7) evaluation = "Rất tốt! Khả năng nghe hiểu kỹ thuật của bạn rất đáng nể.";

            document.getElementById('quiz-content').innerHTML = `
                <div class="finish-screen">
                    <h3 style="font-size:20px; font-weight:700; margin-bottom:10px;">HOÀN THÀNH KIỂM TRA</h3>
                    <div class="score-num">${score}/10</div>
                    <p style="font-size:15px; font-weight:500; color:var(--ios-subtext); margin-bottom: 24px; padding:0 20px;">${evaluation}</p>
                    <button class="next-btn" style="display:block" onclick="startQuiz()">Làm đề thi mới 🔄</button>
                </div>
            `;
            document.getElementById('next-btn').style.display = 'none';
            document.getElementById('feedback-box').style.display = 'none';
        }

        function triggerConfetti() {
            const canvas = document.getElementById("confetti-canvas");
            const ctx = canvas.getContext("2d");
            canvas.width = canvas.parentElement.offsetWidth;
            canvas.height = canvas.parentElement.offsetHeight;
            let particles = [];
            const colors = ['#007af5', '#34c759', '#ff9500', '#ff3b30', '#af52de'];
            
            for (let i = 0; i < 50; i++) {
                particles.push({
                    x: canvas.width / 2, y: canvas.height / 2,
                    w: Math.random() * 6 + 4, h: Math.random() * 10 + 6,
                    color: colors[Math.floor(Math.random() * colors.length)],
                    vx: (Math.random() - 0.5) * 10, vy: (Math.random() - 0.5) * 10 - 3,
                    rotation: Math.random() * 360, rotationSpeed: (Math.random() - 0.5) * 10,
                    alpha: 1
                });
            }
            
            function update() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                let alive = false;
                particles.forEach(p => {
                    p.x += p.vx; p.y += p.vy; p.vy += 0.12; p.alpha -= 0.015;
                    p.rotation += p.rotationSpeed;
                    if (p.alpha > 0) {
                        alive = true;
                        ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rotation * Math.PI / 180);
                        ctx.fillStyle = p.color; ctx.globalAlpha = p.alpha;
                        ctx.fillRect(-p.w/2, -p.h/2, p.w, p.h); ctx.restore();
                    }
                });
                if (alive) requestAnimationFrame(update);
            }
            update();
        }

        renderiOSLists();
    </script>
</body>
</html>
