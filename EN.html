<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- TIÊU ĐỀ TRANG WEB -->
    <title>FM- Học Tiếng</title>

    <!-- CẤU HÌNH HIỂN THỊ KHI CHIA SẺ LINK (ZALO, TELEGRAM, FACEBOOK) -->
    <meta property="og:title" content="FM- Học Tiếng" />
    <meta property="og:description" content="Ứng dụng luyện nghe, phản xạ từ vựng và phát âm chuẩn các mẫu câu giao tiếp kỹ thuật khách sạn." />
    <meta property="og:url" content="https://to14.site/EN" />
    <meta property="og:image" content="/en.png" />
    <meta property="og:type" content="website" />

    <!-- Tailwind CSS & FontAwesome -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-50 font-sans min-h-screen flex flex-col items-center justify-between p-4 selection:bg-green-200">

    <!-- Đối tượng âm thanh HTML5 ẩn để chạy file mp3 Google Dịch -->
    <audio id="google-audio-engine" crossorigin="anonymous"></audio>

    <!-- TOP NAVIGATION & PROGRESS BAR -->
    <div class="w-full max-w-xl flex items-center justify-between gap-4 py-3">
        <button onclick="resetLesson()" class="text-gray-400 hover:text-gray-600 font-bold text-xl transition-colors">✕</button>
        <div class="w-full bg-gray-200 rounded-full h-3.5 overflow-hidden shadow-inner">
            <div id="progress-bar" class="bg-green-500 h-full transition-all duration-300 w-0"></div>
        </div>
        <div class="flex items-center gap-1.5 text-red-500 font-bold text-lg animate-pulse">
            <i class="fa-solid fa-heart"></i>
            <span id="hearts-count">5</span>
        </div>
    </div>

    <!-- MAIN GAME CARD -->
    <div id="game-card" class="w-full max-w-xl bg-white rounded-3xl shadow-xl p-6 flex-1 flex flex-col justify-between my-2 border border-gray-100 min-h-[500px]">
        
        <!-- Question Header -->
        <div>
            <div class="flex items-center gap-2 mb-1">
                <span id="question-badge" class="text-[10px] font-extrabold uppercase tracking-widest px-2 py-0.5 bg-blue-100 text-blue-600 rounded-md">VOCAB</span>
            </div>
            <h2 id="question-title" class="text-xl font-black text-gray-800 mb-1">Đang tải bài học...</h2>
            <p id="question-prompt" class="text-gray-500 text-xs mb-5 font-medium"></p>
            
            <!-- Dynamic Content Area -->
            <div id="question-content" class="min-h-[220px] flex flex-col justify-center items-center w-full">
                <!-- Nội dung nạp tự động bằng JS -->
            </div>
        </div>

        <!-- Feedback & Footer Actions -->
        <div class="mt-4 border-t border-gray-100 pt-5">
            <div id="feedback-message" class="hidden rounded-2xl p-4 mb-4 flex items-center gap-3 font-bold transition-all transform scale-95 duration-200">
                <i id="feedback-icon" class="text-2xl"></i>
                <div class="flex flex-col">
                    <span id="feedback-text-main" class="text-sm"></span>
                    <span id="feedback-text-sub" class="text-xs font-medium opacity-90 mt-0.5"></span>
                </div>
            </div>

            <button id="action-btn" onclick="checkAnswer()" class="w-full bg-green-500 text-white font-extrabold py-4 rounded-2xl shadow-md hover:bg-green-600 active:scale-[0.98] transition-all text-center tracking-wider text-sm cursor-pointer">
                KIỂM TRA
            </button>
        </div>
    </div>

    <script>
        // DATASET GỐC 100% CÁC CÂU TỪ TÀI LIỆU (IMAGE.PNG VÀ IMAGE_2.PNG)
        const originalDataset = [
            // ================= PHẦN 1: ACTIONS =================
            { type: "listening_reading", category: "ACTIONS", title: "Học từ vựng: Hành động", prompt: "Nhấn vào nút LOA màu xanh để nghe phát âm chuẩn từ Google.", english: "Check", vietnamese: "kiểm tra", phonetic: "Chéc-k" },
            { type: "multiple_choice", category: "ACTIONS", title: "Phản xạ từ vựng", prompt: "Từ này có nghĩa là gì? (Bấm loa nếu muốn nghe phát âm Google)", english: "Inspect", options: ["kiểm tra", "kiểm tra kỹ", "sửa", "thay thế"], answer: "kiểm tra kỹ" },
            { type: "listening_reading", category: "ACTIONS", title: "Học từ vựng: Hành động", prompt: "Nhấn vào nút LOA màu xanh để nghe phát âm chuẩn từ Google.", english: "Fix / Repair", vietnamese: "sửa", phonetic: "phíx / rì pai" },
            { type: "multiple_choice", category: "ACTIONS", title: "Phản xạ từ vựng", prompt: "Chọn từ tiếng Anh có nghĩa là: 'thay thế'", options: ["Check", "Inspect", "Replace", "Install"], answer: "Replace" },
            { type: "listening_reading", category: "ACTIONS", title: "Học từ vựng: Hành động", prompt: "Nhấn vào nút LOA màu xanh để nghe phát âm chuẩn từ Google.", english: "Install", vietnamese: "lắp đặt", phonetic: "In-stôl" },
            { type: "multiple_choice", category: "ACTIONS", title: "Phản xạ từ vựng", prompt: "Từ 'Adjust' có nghĩa là gì?", english: "Adjust", options: ["điều chỉnh", "kiểm tra vận hành", "mở", "đóng"], answer: "điều chỉnh" },
            { type: "listening_reading", category: "ACTIONS", title: "Học từ vựng: Hành động", prompt: "Nhấn vào nút LOA màu xanh để nghe phát âm chuẩn từ Google.", english: "Test", vietnamese: "kiểm tra vận hành", phonetic: "Tét-st" },
            { type: "multiple_choice", category: "ACTIONS", title: "Phản xạ từ vựng", prompt: "Cặp từ 'Open – Close' mang ý nghĩa gì?", english: "Open – Close", options: ["bật - tắt", "kiểm tra - sửa", "mở - đóng", "lắp đặt - điều chỉnh"], answer: "mở - đóng" },
            { type: "speaking", category: "ACTIONS", title: "Luyện phát âm chuẩn", prompt: "Nhấn loa nghe trước, sau đó giữ Micro và đọc to cụm từ hành động:", english: "Turn on turn off", vietnamese: "bật - tắt" },

            // ================= PHẦN 2: PROBLEM / STATUS =================
            { type: "listening_reading", category: "STATUS", title: "Học từ vựng: Tình trạng thiết bị", prompt: "Nhấn vào nút LOA màu xanh để nghe phát âm chuẩn từ Google.", english: "Not working", vietnamese: "không hoạt động", phonetic: "Not uốc-king" },
            { type: "multiple_choice", category: "STATUS", title: "Phản xạ từ vựng", prompt: "Từ nào nghĩa là 'bị hỏng'?", options: ["Damaged", "Broken", "Leak", "Blocked"], answer: "Broken" },
            { type: "listening_reading", category: "STATUS", title: "Học từ vựng: Tình trạng thiết bị", prompt: "Nhấn vào nút LOA màu xanh để nghe phát âm chuẩn từ Google.", english: "Damaged", vietnamese: "bị hư hại", phonetic: "Đá-mịch-d" },
            { type: "multiple_choice", category: "STATUS", title: "Phản xạ từ vựng", prompt: "Chọn nghĩa chuẩn cho từ 'Leak / Leakage'", english: "Leak / Leakage", options: ["bị tắc", "bị lỏng", "rò rỉ", "ồn"], answer: "rò rỉ" },
            { type: "listening_reading", category: "STATUS", title: "Học từ vựng: Tình trạng thiết bị", prompt: "Nhấn vào nút LOA màu xanh để nghe phát âm chuẩn từ Google.", english: "Blocked / Clogged", vietnamese: "bị tắc", phonetic: "Blốc-t / Cloc-d" },
            { type: "multiple_choice", category: "STATUS", title: "Phản xạ từ vựng", prompt: "Từ 'Loose' nghĩa là gì?", english: "Loose", options: ["không có điện", "áp lực yếu", "ồn", "bị lỏng"], answer: "bị lỏng" },
            { type: "listening_reading", category: "STATUS", title: "Học từ vựng: Tình trạng thiết bị", prompt: "Nhấn vào nút LOA màu xanh để nghe phát âm chuẩn từ Google.", english: "No power", vietnamese: "không có điện", phonetic: "Nâu-pao-ươ" },
            { type: "multiple_choice", category: "STATUS", title: "Phản xạ từ vựng", prompt: "Cụm từ 'Low pressure' nghĩa là gì?", english: "Low pressure", options: ["áp lực yếu", "không hoạt động", "bị hư hại", "rò rỉ"], answer: "áp lực yếu" },
            { type: "speaking", category: "STATUS", title: "Luyện phát âm chuẩn", prompt: "Bấm loa nghe trước, sau đó giữ Micro và nói từ mô tả tiếng ồn dưới đây:", english: "Noisy", vietnamese: "ồn" },

            // ================= PHẦN 3: CÁC MẪU CÂU CƠ BẢN =================
            { type: "listening_reading", category: "MẪU CÂU", title: "1. Xin phép vào phòng khách", prompt: "Nhấn vào nút LOA màu xanh để nghe toàn bộ mẫu câu từ Google Dịch.", english: "Hello Engineering Team May I come in to fix check the", vietnamese: "Xin chào, bộ phận kỹ thuật. Tôi có thể vào để sửa/ kiểm tra ......?", phonetic: "Hê-lô, en-gi-nia-ring tim. Mei ai căm in tu phích / chéc dờ....?" },
            { type: "speaking", category: "MẪU CÂU", title: "2. Khi không hiểu khách nói", prompt: "Bấm loa nghe, sau đó nhấn Micro và nói lịch sự yêu cầu khách lặp lại:", english: "Sorry could you repeat that please", vietnamese: "Xin vui lòng nhắc lại (Só-ri, cú iu ri-pít đát, plii-zơ?)" },
            { type: "multiple_choice", category: "MẪU CÂU", title: "3. Hỏi bao lâu", prompt: "Chọn câu hỏi mẫu: 'Mất bao lâu để làm gì?'", options: ["How long does it take to", "It takes 15 minutes", "I'm sorry for this inconvenience", "All fixed"], answer: "How long does it take to" },
            { type: "listening_reading", category: "MẪU CÂU", title: "3. Trả lời thời gian", prompt: "Nhấn vào nút LOA màu xanh để nghe toàn bộ mẫu câu từ Google Dịch.", english: "It takes 15 minutes", vietnamese: "Nó mất 15 phút", phonetic: "Ít tek phíp tin mí nịt -s......?" },
            { type: "speaking", category: "MẪU CÂU", title: "4. Xin lỗi khi sửa lâu", prompt: "Bấm loa nghe, sau đó nhấn giữ Micro và đọc câu xin lỗi khách hàng chân thành:", english: "I am sorry for this inconvenience", vietnamese: "Tôi rất xin lỗi về sự bất tiện này! (Ai am só ry pho dzít in- kòn -ví -ni- ình)" },
            { type: "multiple_choice", category: "MẪU CÂU", title: "5. Dặn khách trước khi sửa", prompt: "Dịch câu: 'Tôi sẽ tắt điện trong giây lát.' sang tiếng Anh.", options: ["Power is restored.", "I will comeback later to fix.", "I will turn off the power for a moment.", "It is working now."], answer: "I will turn off the power for a moment." },
            { type: "listening_reading", category: "MẪU CÂU", title: "5. Báo khách khi có điện trở lại", prompt: "Nhấn vào nút LOA màu xanh để nghe toàn bộ mẫu câu từ Google Dịch.", english: "Power is restored", vietnamese: "điện đã có lại", phonetic: "Pao ờ y rì-sờ-to" },
            { type: "multiple_choice", category: "MẪU CÂU", title: "6. Báo khách khi sửa xong", prompt: "Cụm từ nào báo hiệu ngắn gọn 'đã sửa xong'?", options: ["You're welcome", "All fixed", "That's quite all right", "Please let me know"], answer: "All fixed" },
            { type: "speaking", category: "MẪU CÂU", title: "6. Thông báo hoạt động", prompt: "Bấm loa nghe trước, sau đó nhấn Micro và báo tin vui thiết bị đã hoạt động bình thường:", english: "It is working now", vietnamese: "Nó đã hoạt động (Ol phích-xịt, Ít I uốc-king nou)" },
            { type: "listening_reading", category: "MẪU CÂU", title: "7. Chưa sửa được", prompt: "Nhấn vào nút LOA màu xanh để nghe toàn bộ mẫu câu từ Google Dịch.", english: "I will comeback later to fix We need to replace some parts", vietnamese: "Tôi sẽ quay lại sửa sau, tôi cần thay thế 1 vài bộ phận", phonetic: "Ai wiu com-béc lây-tờ to phít. Wi nít to rì-pờ-lây sum pát-s" },
            { type: "multiple_choice", category: "MẪU CÂU", title: "8. Phản hồi khi khách cảm ơn", prompt: "Đáp lại lời cảm ơn của khách một cách lịch sự:", options: ["That's quite all right", "You're welcome", "Please let me know", "All fixed"], answer: "You're welcome" },
            { type: "speaking", category: "MẪU CÂU", title: "9. Phản hồi khi được xin lỗi", prompt: "Bấm loa nghe, sau đó đọc câu phản hồi lịch thiệp: 'Không sao đâu'", english: "Thats quite all right", vietnamese: "Không sao đâu (Dzát quai ó rây)" },
            { type: "speaking", category: "MẪU CÂU", title: "10. Hỏi khách cần giúp gì thêm", prompt: "Bấm loa nghe, sau đó nhấn giữ Micro và đọc câu chào kết thúc quy trình chăm sóc:", english: "Please let me know if you need anything else", vietnamese: "Nếu quý khách cần thêm bất kỳ hỗ trợ nào, vui lòng cho tôi biết." }
        ];

        let dataset = []; 
        let currentIndex = 0;
        let hearts = 5;
        let selectedOption = null;
        let isRecording = false;
        let recognition = null;

        // THUẬT TOÁN XÁO TRỘN NGẪU NHIÊN CÂU HỎI THEO MỖI LƯỢT CHƠI MỚI
        function shuffleDataset() {
            dataset = [...originalDataset];
            for (let i = dataset.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [dataset[i], dataset[j]] = [dataset[j], dataset[i]];
            }
        }

        if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            recognition = new SpeechRecognition();
            recognition.lang = 'en-US';
            recognition.interimResults = false;
            recognition.maxAlternatives = 1;
        }

        // KẾT NỐI VÀ ÉP LUỒNG PHÁT ÂM GOOGLE TRANSLATE QUA PROXY KHÔNG LO LỖI CHẶN CORS / FILE LOCAL
        function playAudio(text) {
            const audioPlayer = document.getElementById('google-audio-engine');
            
            // Chuẩn hóa văn bản gửi lên Google
            let cleanText = encodeURIComponent(text.replace(/\//g, " or ").replace(/–/g, " to "));
            
            // Link API gốc Google Translate giọng Mỹ
            let googleTtsUrl = `https://translate.google.com/translate_tts?ie=UTF-8&tl=en&client=tw-ob&q=${cleanText}`;
            
            // Đưa qua Proxy mở để loại bỏ hoàn toàn cơ chế chặn 403 Forbidden của Google
            let bypassCorsUrl = `https://api.allorigins.win/raw?url=${encodeURIComponent(googleTtsUrl)}`;

            audioPlayer.src = bypassCorsUrl;
            audioPlayer.load();

            // Hiệu ứng chuyển động nảy nút loa khi click chuộng trực quan
            const speakerButtons = document.querySelectorAll('.fa-volume-high');
            speakerButtons.forEach(btn => {
                btn.parentElement.classList.add('opacity-50', 'scale-95');
                setTimeout(() => btn.parentElement.classList.remove('opacity-50', 'scale-95'), 200);
            });

            // Tiến hành phát âm thanh MP3
            let playPromise = audioPlayer.play();
            if (playPromise !== undefined) {
                playPromise.catch(error => {
                    // Fallback (Dự phòng): Nếu mạng bị rớt, bốc công cụ Speech của hệ thống máy tính ra đọc
                    if ('speechSynthesis' in window) {
                        window.speechSynthesis.cancel();
                        window.speechSynthesis.resume();
                        const utterance = new SpeechSynthesisUtterance(text.replace(/\//g, " or "));
                        utterance.lang = 'en-US';
                        window.speechSynthesis.speak(utterance);
                    }
                });
            }
        }

        function loadQuestion() {
            if (currentIndex >= dataset.length) {
                showVictoryScreen();
                return;
            }

            selectedOption = null;
            document.getElementById('feedback-message').className = "hidden rounded-2xl p-4 mb-4 flex items-center gap-3 font-bold transition-all transform scale-95 duration-200";
            
            const actionBtn = document.getElementById('action-btn');
            actionBtn.innerText = "KIỂM TRA";
            actionBtn.onclick = checkAnswer;
            actionBtn.className = "w-full bg-green-500 text-white font-extrabold py-4 rounded-2xl shadow-md hover:bg-green-600 active:scale-[0.98] transition-all text-center tracking-wider text-sm cursor-pointer";

            document.getElementById('progress-bar').style.width = `${(currentIndex / dataset.length) * 100}%`;
            document.getElementById('hearts-count').innerText = hearts;

            const q = dataset[currentIndex];
            
            const badge = document.getElementById('question-badge');
            badge.innerText = q.category;
            if(q.category === "ACTIONS") badge.className = "text-[10px] font-extrabold uppercase tracking-widest px-2 py-0.5 bg-blue-100 text-blue-600 rounded-md";
            else if(q.category === "STATUS") badge.className = "text-[10px] font-extrabold uppercase tracking-widest px-2 py-0.5 bg-amber-100 text-amber-600 rounded-md";
            else badge.className = "text-[10px] font-extrabold uppercase tracking-widest px-2 py-0.5 bg-purple-100 text-purple-600 rounded-md";

            document.getElementById('question-title').innerText = q.title;
            document.getElementById('question-prompt').innerText = q.prompt;

            const contentArea = document.getElementById('question-content');
            contentArea.innerHTML = "";

            if (q.type === "listening_reading") {
                contentArea.innerHTML = `
                    <div class="flex flex-col items-center gap-4 text-center w-full shadow-sm border border-gray-100 p-5 rounded-2xl bg-slate-50/50">
                        <button onclick="playAudio('${q.english}')" class="w-20 h-20 bg-blue-500 hover:bg-blue-600 text-white text-3xl rounded-full flex items-center justify-center shadow-lg transition-all cursor-pointer transform duration-100">
                            <i class="fa-solid fa-volume-high"></i>
                        </button>
                        <h1 class="text-2xl font-black text-slate-800 tracking-wide mt-2">${q.english}</h1>
                        ${q.phonetic ? `<p class="text-xs font-bold text-blue-600 bg-blue-50 px-3 py-1 rounded-full border border-blue-100">Mẹo đọc: ${q.phonetic}</p>` : ''}
                        <div class="h-[1px] bg-gray-200 w-1/2 my-1"></div>
                        <p class="text-base font-bold text-emerald-600">Nghĩa: ${q.vietnamese}</p>
                    </div>
                `;
                actionBtn.innerText = "ĐÃ HIỂU / TIẾP TỤC";
                actionBtn.className = "w-full bg-blue-500 text-white font-extrabold py-4 rounded-2xl shadow-md hover:bg-blue-600 active:scale-[0.98] transition-all text-center tracking-wider text-sm cursor-pointer";
                actionBtn.onclick = nextQuestion;

            } else if (q.type === "multiple_choice") {
                let html = `<div class="w-full flex flex-col gap-2.5">`;
                if(q.english) {
                    html += `
                        <div class="flex items-center justify-center gap-2 mb-2 bg-slate-50 p-3 rounded-xl border border-gray-100">
                            <h3 class="text-lg font-extrabold text-slate-700">${q.english}</h3>
                            <button onclick="playAudio('${q.english}')" class="text-blue-500 hover:text-blue-700 text-sm cursor-pointer p-1"><i class="fa-solid fa-volume-high"></i> Nghe bằng Google</button>
                        </div>
                    `;
                }
                q.options.forEach((opt, i) => {
                    html += `
                        <button id="opt-${i}" onclick="selectOption('${opt}', ${i})" class="w-full text-left font-bold p-3.5 rounded-xl border-2 border-gray-200 hover:bg-gray-50 active:bg-gray-100 transition-all flex items-center gap-3 cursor-pointer group text-sm">
                            <span class="w-6 h-6 bg-gray-100 border border-gray-300 text-gray-500 rounded-md flex items-center justify-center text-[11px] font-black group-hover:border-blue-400 transition-colors">${i+1}</span>
                            <span class="text-gray-700">${opt}</span>
                        </button>
                    `;
                });
                html += `</div>`;
                contentArea.innerHTML = html;

            } else if (q.type === "speaking") {
                contentArea.innerHTML = `
                    <div class="flex flex-col items-center gap-3 text-center w-full bg-slate-50/50 p-5 rounded-2xl border border-gray-100">
                        <div class="flex gap-2 items-center justify-center bg-white px-4 py-2 rounded-full shadow-sm border border-gray-100">
                            <h1 class="text-lg font-black text-slate-800">${q.english}</h1>
                            <button onclick="playAudio('${q.english}')" class="text-blue-500 hover:text-blue-700 text-base cursor-pointer p-1"><i class="fa-solid fa-volume-high"></i></button>
                        </div>
                        <p class="text-emerald-600 text-xs font-bold">"${q.vietnamese}"</p>
                        
                        <button id="mic-btn" onclick="toggleSpeech()" class="w-24 h-24 bg-red-500 hover:bg-red-600 text-white rounded-full flex flex-col items-center justify-center gap-1 shadow-lg transition-all mt-4 cursor-pointer active:scale-95">
                            <i id="mic-icon" class="fa-solid fa-microphone text-2xl"></i>
                            <span id="mic-status" class="text-[9px] font-black uppercase tracking-wider">Bấm để nói</span>
                        </button>
                        
                        <p id="speech-result" class="text-xs font-bold text-gray-400 mt-2 min-h-[16px] italic"></p>
                    </div>
                `;
            }
        }

        function selectOption(val, idx) {
            const q = dataset[currentIndex];
            selectedOption = val;
            q.options.forEach((_, i) => {
                document.getElementById(`opt-${i}`).className = "w-full text-left font-bold p-3.5 rounded-xl border-2 border-gray-200 hover:bg-gray-50 transition-all flex items-center gap-3 cursor-pointer group text-sm";
            });
            document.getElementById(`opt-${idx}`).className = "w-full text-left font-bold p-3.5 rounded-xl border-2 border-blue-500 bg-blue-50/60 transition-all flex items-center gap-3 cursor-pointer group text-sm";
        }

        function toggleSpeech() {
            if (!recognition) {
                alert("Vui lòng mở bằng Google Chrome hoặc Edge để bật Microphone thu âm.");
                return;
            }

            const micBtn = document.getElementById('mic-btn');
            const micStatus = document.getElementById('mic-status');
            const resultText = document.getElementById('speech-result');

            if (!isRecording) {
                isRecording = true;
                micBtn.className = "w-24 h-24 bg-red-600 text-white rounded-full flex flex-col items-center justify-center gap-1 shadow-xl transition-all mt-4 animate-pulse";
                micStatus.innerText = "Đang nghe...";
                resultText.innerText = "Mời bạn đọc...";
                recognition.start();

                recognition.onresult = function(event) {
                    let textResult = event.results[0][0].transcript;
                    selectedOption = textResult.toLowerCase().replace(/[.,\/#!$%\^&\*;:{}=\-_`~()]/g,"").trim();
                    resultText.innerHTML = `Bạn vừa nói: <span class="text-blue-600 font-extrabold">"${textResult}"</span>`;
                    stopRecordingState();
                };

                recognition.onerror = function() {
                    resultText.innerText = "Chưa nghe thấy tiếng, vui lòng bấm nói lại.";
                    stopRecordingState();
                };
                recognition.onend = function() { stopRecordingState(); };
            } else {
                recognition.stop();
                stopRecordingState();
            }
        }

        function stopRecordingState() {
            isRecording = false;
            const micBtn = document.getElementById('mic-btn');
            if(micBtn) micBtn.className = "w-24 h-24 bg-red-500 hover:bg-red-600 text-white rounded-full flex flex-col items-center justify-center gap-1 shadow-lg transition-all mt-4 cursor-pointer";
            const micStatus = document.getElementById('mic-status');
            if(micStatus) micStatus.innerText = "Bấm để nói";
        }

        function checkAnswer() {
            const q = dataset[currentIndex];
            const feedbackBox = document.getElementById('feedback-message');
            const feedbackIcon = document.getElementById('feedback-icon');
            const mainText = document.getElementById('feedback-text-main');
            const subText = document.getElementById('feedback-text-sub');
            const actionBtn = document.getElementById('action-btn');

            let isCorrect = false;

            if (q.type === "multiple_choice") {
                if (!selectedOption) {
                    alert("Hãy chọn một đáp án!");
                    return;
                }
                isCorrect = (selectedOption === q.answer);
            } else if (q.type === "speaking") {
                if (!selectedOption) {
                    alert("Hãy nhấn Micro và đọc từ mẫu!");
                    return;
                }
                let expectedClean = q.english.toLowerCase().replace(/[.,\/#!$%\^&\*;:{}=\-_`~()]/g,"").trim();
                isCorrect = (selectedOption.includes(expectedClean) || expectedClean.includes(selectedOption));
            }

            feedbackBox.classList.remove('hidden');
            
            if (isCorrect) {
                feedbackBox.className = "rounded-2xl p-4 mb-4 flex items-center gap-3 font-bold bg-green-100 text-green-800 border border-green-200 transform scale-100";
                feedbackIcon.className = "fa-solid fa-circle-check text-2xl text-green-600";
                mainText.innerText = "Chính xác! Cố lên.";
                subText.innerText = "";
            } else {
                feedbackBox.className = "rounded-2xl p-4 mb-4 flex items-center gap-3 font-bold bg-red-100 text-red-800 border border-red-200 transform scale-100";
                feedbackIcon.className = "fa-solid fa-circle-xmark text-2xl text-red-600";
                mainText.innerText = "Chưa đúng rồi!";
                subText.innerText = q.type === "speaking" ? `Câu mẫu: "${q.english}"` : `Đáp án: ${q.answer}`;
                
                hearts--;
                document.getElementById('hearts-count').innerText = hearts;
                if (hearts <= 0) {
                    setTimeout(() => {
                        alert("Hết tim rồi! Hệ thống tự động sáo trộn mới và reset lại bài học.");
                        resetLesson();
                    }, 400);
                    return;
                }
            }

            actionBtn.innerText = "TIẾP THEO";
            actionBtn.className = "w-full bg-blue-500 text-white font-extrabold py-4 rounded-2xl shadow-md hover:bg-blue-600 active:scale-[0.98] transition-all text-center tracking-wider text-sm cursor-pointer";
            actionBtn.onclick = nextQuestion;
        }

        function nextQuestion() {
            currentIndex++;
            loadQuestion();
        }

        function showVictoryScreen() {
            document.getElementById('progress-bar').style.width = `100%`;
            const contentArea = document.getElementById('question-content');
            document.getElementById('question-badge').innerText = "SUCCESS";
            document.getElementById('question-title').innerText = "Chúc mừng bạn!";
            document.getElementById('question-prompt').innerText = "Bạn đã hoàn thành xuất sắc bài học.";

            contentArea.innerHTML = `
                <div class="text-center flex flex-col items-center gap-3 p-4">
                    <i class="fa-solid fa-trophy text-6xl text-amber-500 animate-bounce"></i>
                    <h2 class="text-xl font-black text-slate-800 mt-2">Hoàn Thành Bài Học!</h2>
                    <p class="text-xs text-gray-500 max-w-sm font-medium">Bạn đã học thuộc lòng toàn bộ từ vựng kỹ thuật cốt lõi và các mẫu câu giao tiếp từ tài liệu.</p>
                </div>
            `;
            
            const actionBtn = document.getElementById('action-btn');
            actionBtn.innerText = "HỌC LẠI (SÁO TRỘN MỚI)";
            actionBtn.className = "w-full bg-amber-500 text-white font-extrabold py-4 rounded-2xl shadow-md hover:bg-amber-600 active:scale-[0.98] transition-all text-center tracking-wider text-sm cursor-pointer";
            actionBtn.onclick = resetLesson;
        }

        function resetLesson() {
            currentIndex = 0;
            hearts = 5;
            shuffleDataset(); // Xáo trộn lại mảng câu hỏi ngẫu nhiên khi sang lượt chơi mới
            loadQuestion();
        }

        window.onload = function() {
            shuffleDataset(); // Xáo trộn danh sách khi tải trang
            loadQuestion();
        };
    </script>
</body>
</html>
